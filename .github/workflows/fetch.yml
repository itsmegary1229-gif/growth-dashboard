name: Fetch PubMed

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = 台灣 06:00
  workflow_dispatch:
    inputs:
      summarize_limit:
        description: "AI 摘要本次最多處理幾篇（初始補跑可填 200）"
        type: number
        default: 60

permissions:
  contents: write

concurrency:
  group: fetch-pubmed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch PubMed articles
        run: python scripts/fetch_pubmed.py

      # 影片失敗不擋論文更新；YouTube RSS 常間歇性 404，腳本會重試，給足時間
      - name: Fetch YouTube videos
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/fetch_videos.py

      # RSS／Atom 文章；單一 feed 失敗腳本會跳過，整步失敗也不擋其他資料
      - name: Fetch RSS feeds
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch_feeds.py

      # 摘要失敗不擋文章更新：continue-on-error，下一步照樣 commit
      - name: Summarize with Claude
        continue-on-error: true
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARIZE_LIMIT: ${{ inputs.summarize_limit || 60 }}
        run: python scripts/summarize.py --limit "$SUMMARIZE_LIMIT"

      # articles.json、videos.json、feeds.json，以及 fetch_videos.py 回寫 channel_id 的 channels.json
      - name: Commit if changed
        run: |
          FILES="data/articles.json data/videos.json data/feeds.json config/channels.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "資料無變更，略過 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(for f in $FILES; do [ -e "$f" ] && echo "$f"; done)
          git commit -m "chore: update data $(TZ=Asia/Taipei date +%F)"
          git push
