name: Fetch PubMed

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = 台灣 06:00
  workflow_dispatch:
    inputs:
      summarize_limit:
        description: "AI 摘要本次最多處理幾篇（初始補跑可填 200）"
        type: number
        default: 60

permissions:
  contents: write

concurrency:
  group: fetch-pubmed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch PubMed articles
        run: python scripts/fetch_pubmed.py

      # 摘要失敗不擋文章更新：continue-on-error，下一步照樣 commit
      - name: Summarize with Claude
        continue-on-error: true
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARIZE_LIMIT: ${{ inputs.summarize_limit || 60 }}
        run: python scripts/summarize.py --limit "$SUMMARIZE_LIMIT"

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/articles.json && \
             [ -z "$(git ls-files --others --exclude-standard data/articles.json)" ]; then
            echo "data/articles.json 無變更，略過 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "chore: update articles $(TZ=Asia/Taipei date +%F)"
          git push
