<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e6466">
  <title>Dr. Yang的精神時光屋</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <h1 class="site-title">Dr. Yang的精神時光屋</h1>
        <p class="site-meta" id="meta">載入中…</p>
      </div>
      <div class="account" id="account">
        <button type="button" class="account-btn" id="login-btn" aria-expanded="false" aria-controls="login-form" hidden>登入</button>
        <button type="button" class="account-btn" id="logout-btn" hidden>登出</button>
        <form class="login-form" id="login-form" novalidate hidden>
          <label class="field">
            <span>Email</span>
            <input type="email" id="login-email" autocomplete="username" inputmode="email" required>
          </label>
          <label class="field">
            <span>密碼</span>
            <input type="password" id="login-password" autocomplete="current-password" required>
          </label>
          <p class="login-error" id="login-error" role="alert"></p>
          <button type="submit" class="login-submit" id="login-submit">送出</button>
        </form>
      </div>
    </div>
    <div class="wrap">
      <div class="section-tabs" role="tablist" aria-label="分區">
        <button type="button" role="tab" class="section-tab" data-section="papers" aria-selected="true">論文</button>
        <button type="button" role="tab" class="section-tab" data-section="videos" aria-selected="false">影片</button>
        <button type="button" role="tab" class="section-tab" data-section="articles" aria-selected="false">文章</button>
        <button type="button" role="tab" class="section-tab" data-section="review" aria-selected="false">回顧</button>
      </div>
    </div>
  </header>

  <!-- 論文分區（assets/js/sections/papers.js） -->
  <div class="section" id="section-papers">
  <nav class="controls" aria-label="篩選">
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-tab="new" aria-selected="true">新進</button>
        <button type="button" role="tab" class="tab" data-tab="later" aria-selected="false">稍後細讀 <span class="tab-count" id="later-count"></span></button>
        <button type="button" role="tab" class="tab" data-tab="saved" aria-selected="false">收藏</button>
        <button type="button" role="tab" class="tab" data-tab="read" aria-selected="false">已讀</button>
        <button type="button" role="tab" class="tab" data-tab="manual" aria-selected="false">自選</button>
      </div>
      <div class="pills" id="topics" role="radiogroup" aria-label="主題"></div>
      <div class="search" role="search">
        <input type="search" class="search-input" id="search" placeholder="搜尋標題、摘要"
          aria-label="關鍵字搜尋" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="search-clear" id="search-clear" aria-label="清除搜尋" hidden>×</button>
      </div>
      <div class="subbar" id="subbar">
        <div class="range" id="range" role="radiogroup" aria-label="時間範圍">
          <button type="button" class="seg" data-range="7">近 7 天</button>
          <button type="button" class="seg" data-range="30">近 30 天</button>
          <button type="button" class="seg" data-range="all">全部</button>
        </div>
        <div class="range" id="sort" role="radiogroup" aria-label="排序">
          <button type="button" class="seg sort-seg" data-sort="rel">相關度</button>
          <button type="button" class="seg sort-seg" data-sort="time">時間</button>
        </div>
        <label class="switch">
          <input type="checkbox" id="hide-read">
          <span class="switch-track" aria-hidden="true"></span>
          <span>隱藏已讀</span>
        </label>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div class="result-bar">
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="result-actions">
        <button type="button" class="export-btn" id="export-ris" hidden>匯出 RIS</button>
        <button type="button" class="export-btn add-btn" id="add-article">＋ 加入文章</button>
      </div>
    </div>
    <div id="list" class="list"></div>
  </main>
  </div>

  <!-- 影片分區（assets/js/sections/videos.js，共用 listSection.js） -->
  <div class="section" id="section-videos" hidden>
  <nav class="controls" aria-label="篩選">
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-tab="new" aria-selected="true">新進</button>
        <button type="button" role="tab" class="tab" data-tab="later" aria-selected="false">稍後看 <span class="tab-count" id="v-later-count"></span></button>
        <button type="button" role="tab" class="tab" data-tab="done" aria-selected="false">已看</button>
      </div>
      <div class="pills" id="v-sources" role="radiogroup" aria-label="頻道"></div>
      <div class="search" role="search">
        <input type="search" class="search-input" id="v-search" placeholder="搜尋標題、說明"
          aria-label="關鍵字搜尋" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="search-clear" id="v-search-clear" aria-label="清除搜尋" hidden>×</button>
      </div>
      <div class="subbar" id="v-subbar">
        <div class="range" id="v-range" role="radiogroup" aria-label="時間範圍">
          <button type="button" class="seg" data-range="7">近 7 天</button>
          <button type="button" class="seg" data-range="30">近 30 天</button>
          <button type="button" class="seg" data-range="all">全部</button>
        </div>
        <label class="switch">
          <input type="checkbox" id="v-hide-done">
          <span class="switch-track" aria-hidden="true"></span>
          <span>隱藏已看</span>
        </label>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div class="result-bar">
      <p class="result-count" id="v-result-count" aria-live="polite"></p>
    </div>
    <div id="v-list" class="list"></div>
  </main>
  </div>

  <!-- 文章分區（assets/js/sections/articles.js，共用 listSection.js） -->
  <div class="section" id="section-articles" hidden>
  <nav class="controls" aria-label="篩選">
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-tab="new" aria-selected="true">新進</button>
        <button type="button" role="tab" class="tab" data-tab="later" aria-selected="false">稍後讀 <span class="tab-count" id="a-later-count"></span></button>
        <button type="button" role="tab" class="tab" data-tab="done" aria-selected="false">已讀</button>
      </div>
      <div class="pills" id="a-sources" role="radiogroup" aria-label="分類與來源"></div>
      <div class="pills subpills" id="a-subsources" role="radiogroup" aria-label="來源" hidden></div>
      <div class="search" role="search">
        <input type="search" class="search-input" id="a-search" placeholder="搜尋標題、摘要"
          aria-label="關鍵字搜尋" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="search-clear" id="a-search-clear" aria-label="清除搜尋" hidden>×</button>
      </div>
      <div class="subbar" id="a-subbar">
        <div class="range" id="a-range" role="radiogroup" aria-label="時間範圍">
          <button type="button" class="seg" data-range="7">近 7 天</button>
          <button type="button" class="seg" data-range="30">近 30 天</button>
          <button type="button" class="seg" data-range="all">全部</button>
        </div>
        <label class="switch">
          <input type="checkbox" id="a-hide-done">
          <span class="switch-track" aria-hidden="true"></span>
          <span>隱藏已讀</span>
        </label>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div class="result-bar">
      <p class="result-count" id="a-result-count" aria-live="polite"></p>
    </div>
    <div id="a-list" class="list"></div>
  </main>
  </div>

  <!-- 回顧分區（assets/js/sections/review.js） -->
  <div class="section" id="section-review" hidden>
  <main class="wrap">
    <div id="review" class="review"></div>
  </main>
  </div>

  <!-- 論文全文解析（assets/js/analysis.js；論文各分頁與回顧區共用） -->
  <dialog class="an-dialog" id="analysis-dialog" aria-labelledby="an-title">
    <div class="an-frame">
      <div class="an-head">
        <div class="an-head-text">
          <p class="an-kicker">全文解析</p>
          <h2 class="an-title" id="an-title"></h2>
        </div>
        <button type="button" class="an-close" data-act="close" aria-label="關閉">×</button>
      </div>
      <div class="an-body" id="an-body"></div>
      <form class="an-ask" id="an-ask" hidden>
        <textarea class="an-ask-input" id="an-ask-input" rows="2" aria-label="追問"
          placeholder="針對這篇追問，例如：皮瓣存活率怎麼定義？"></textarea>
        <button type="submit" class="an-btn an-primary" id="an-ask-send">送出</button>
      </form>
      <input type="file" id="an-file" accept="application/pdf,.pdf" hidden>
    </div>
  </dialog>

  <!-- 自選文章：加入文章（assets/js/addArticle.js） -->
  <dialog class="an-dialog add-dialog" id="add-dialog" aria-labelledby="add-title">
    <div class="an-frame">
      <div class="an-head">
        <div class="an-head-text">
          <p class="an-kicker">自選文章</p>
          <h2 class="an-title" id="add-title">加入文章</h2>
        </div>
        <button type="button" class="an-close" data-act="close" aria-label="關閉">×</button>
      </div>
      <div class="an-body" id="add-body"></div>
      <input type="file" id="add-file" accept="application/pdf,.pdf" hidden>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
